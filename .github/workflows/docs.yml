# Builds the Sphinx site and publishes it to GitHub Pages.
# One-time setup: repo Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: docs

on:
  push:
    branches: [main]          # rebuild on every push to the docs repo
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  repository_dispatch:        # triggered by tool repos (see examples/)
    types: [tool-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-doc.txt

      - name: Install Sphinx and extensions (no project tool is installed)
        run: pip install -r requirements-doc.txt

      - name: Build HTML (clones Python tool sources listed in docs/python-tools.toml)
        run: sphinx-build -b html docs docs/_build/html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
